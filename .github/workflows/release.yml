name: Beta Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .work/rtk
      - run: python -m pip install -e ".[test,engine]" -c requirements.lock
      - run: python scripts/ci_engines.py
      - run: python -m pytest -q
      - run: python scripts/package.py
      - run: python scripts/install_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: dist/*
  publish:
    needs: package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Publish private beta assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS.txt
          gh release create "$TAG" dist/*.zip dist/*.tar.gz dist/SHA256SUMS.txt --title "Codex Token Saver $TAG" --prerelease --notes-file docs/RELEASE_NOTES.md
